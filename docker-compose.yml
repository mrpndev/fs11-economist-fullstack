services:
    db:
        image: postgres:18.6
        container_name: economist_db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: dbLocal
            POSTGRES_DB: economist
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
    server:
        build: ./server
        container_name: economist_server
        ports:
            - "4000:4000"
        env_file:
            - ./server/.env
        depends_on:
            - db
        volumes:
            - ./server:/app
            - /app/node_modules
    client:
        build: ./client
        container_name: economist_client
        ports:
            - "5173:5173"
        depends_on:
            - server
        volumes:
            - ./client:/app
            - /app/node_modules
volumes:
    postgres_data:
